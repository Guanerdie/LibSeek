# gitleaks 规则。用官方默认规则集，再补几条这个项目特有的。
[extend]
useDefault = true

[[rules]]
id = "unin-production-host"
description = "生产服务器地址不能进公开仓库，用 <PROD_HOST> 或 SSH Host 别名代替"
# 公网 IPv4。私有网段和文档示例地址在下面的 allowlist 里放行。
regex = '''\b(?:\d{1,3}\.){3}\d{1,3}\b'''
tags = ["host", "infrastructure"]

[[rules]]
id = "unin-pt-passkey"
description = "PT 站 passkey 只能来自运行时配置，不能写进代码或文档"
regex = '''(?i)passkey\s*[=:]\s*["']?[a-f0-9]{16,64}["']?'''
tags = ["credential"]

[[rules]]
id = "unin-qb-credentials"
description = "qBittorrent 凭据只能来自环境变量"
regex = '''(?i)\bQB_(?:USERNAME|PASSWORD)\s*=\s*["']?[^\s"'{$][^\s"']*'''
tags = ["credential"]

[allowlist]
description = "误报放行"
paths = [
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)uv\.lock$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)\.pre-commit-config\.yaml$''',
]
regexes = [
  # 本地/回环/私有网段，以及子网掩码和版本号里常见的四段数字。
  '''\b127\.0\.0\.1\b''',
  '''\b0\.0\.0\.0\b''',
  '''\b255\.255\.\d{1,3}\.\d{1,3}\b''',
  '''\b10\.(?:\d{1,3}\.){2}\d{1,3}\b''',
  '''\b192\.168\.(?:\d{1,3})\.\d{1,3}\b''',
  '''\b172\.(?:1[6-9]|2\d|3[01])\.(?:\d{1,3})\.\d{1,3}\b''',
  # 文档里用来举例的占位地址（RFC 5737）。
  '''\b19[28]\.0\.2\.\d{1,3}\b''',
  '''\b203\.0\.113\.\d{1,3}\b''',
  # 环境变量占位，例如 QB_PASSWORD=${QB_PASSWORD:-}
  '''\$\{[A-Z_]+:?-?\}''',
]
