services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unin}
      POSTGRES_USER: ${POSTGRES_USER:-unin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  api:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-unin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-unin}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
